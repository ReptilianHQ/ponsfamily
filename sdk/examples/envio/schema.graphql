"""Minimal launch identity and exact full-supply mint evidence."""
type PonsLaunch {
  id: ID!
  token: String! @index
  curve: String @index
  deployer: String @index
  pairToken: String
  launchConfigId: BigInt
  graduationThreshold: BigInt
  canonicalSupply: BigInt
  createdBlock: BigInt
  supplyMintBlock: BigInt
}

"""Append-only normalized envelope for every reviewed Pons protocol event."""
type PonsProtocolEvent {
  id: ID!
  kind: String! @index
  contract: String! @index
  sourceAddress: String! @index
  transactionHash: String @index
  blockNumber: BigInt! @index
  logIndex: BigInt!
  payload: String!
}
