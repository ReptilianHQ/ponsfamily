name: Pons SDK

on:
  pull_request:
    paths:
      - "sdk/**"
      - ".github/workflows/sdk.yml"
      - ".github/workflows/sdk-release.yml"
  push:
    branches: [main]
    paths:
      - "sdk/**"
      - ".github/workflows/sdk.yml"
      - ".github/workflows/sdk-release.yml"

permissions:
  contents: read

concurrency:
  group: pons-sdk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node scripts/check-production-git-install.mjs
        env:
          PONS_SDK_GIT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
