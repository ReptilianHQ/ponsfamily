name: Request Pons SDK release

on:
  push:
    branches:
      - "release/v*"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record the unprivileged release request
        run: |
          test "${GITHUB_EVENT_NAME}" = push
          test "${GITHUB_REF_TYPE}" = branch || test "${GITHUB_REF_TYPE}" = tag
          test -n "${GITHUB_REF_NAME}"
          test "${GITHUB_SHA}" != 0000000000000000000000000000000000000000
          jq -n \
            --arg refType "${GITHUB_REF_TYPE}" \
            --arg refName "${GITHUB_REF_NAME}" \
            --arg sourceSha "${GITHUB_SHA}" \
            '{refType: $refType, refName: $refName, sourceSha: $sourceSha}' \
            > release-request.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pons-sdk-release-request
          path: release-request.json
          if-no-files-found: error
          retention-days: 1
