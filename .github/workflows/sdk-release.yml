name: Publish Pons SDK

on:
  workflow_run:
    workflows:
      - Request Pons SDK release
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  authorize:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      ref_type: ${{ steps.authorize.outputs.ref_type }}
      ref_name: ${{ steps.authorize.outputs.ref_name }}
      source_sha: ${{ steps.authorize.outputs.source_sha }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: pons-sdk-release-request
          path: ${{ runner.temp }}/pons-sdk-release-request
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Authorize the remote ref using trusted default-branch code
        id: authorize
        env:
          EVENT_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          request_file="${RUNNER_TEMP}/pons-sdk-release-request/release-request.json"
          ref_type="$(jq -er .refType "$request_file")"
          ref_name="$(jq -er .refName "$request_file")"
          source_sha="$(jq -er .sourceSha "$request_file")"
          test "$source_sha" = "$EVENT_SOURCE_SHA"
          semver='v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          if [ "$ref_type" = branch ]; then
            [[ "$ref_name" =~ ^release/${semver}$ ]]
          elif [ "$ref_type" = tag ]; then
            [[ "$ref_name" =~ ^${semver}$ ]]
          else
            exit 1
          fi
          if [ "$ref_type" = branch ]; then
            ref_path="heads/${ref_name}"
          else
            ref_path="tags/${ref_name}"
          fi
          ref_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/${ref_path}")"
          object_type="$(jq -r .object.type <<<"$ref_object")"
          remote_sha="$(jq -r .object.sha <<<"$ref_object")"
          while [ "$object_type" = tag ]; do
            tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${remote_sha}")"
            object_type="$(jq -r .object.type <<<"$tag_object")"
            remote_sha="$(jq -r .object.sha <<<"$tag_object")"
          done
          test "$object_type" = commit
          test "$remote_sha" = "$source_sha"
          main_sha="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/commits" -f sha=main -f per_page=1 --jq '.[0].sha')"
          main_status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${source_sha}...${main_sha}" --jq .status)"
          test "$main_status" = ahead || test "$main_status" = identical
          echo "ref_type=$ref_type" >> "$GITHUB_OUTPUT"
          echo "ref_name=$ref_name" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

  publish:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      group: pons-sdk-publish
      queue: max
      cancel-in-progress: false
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.authorize.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: "@reptilianhq"
      - name: Validate release identity
        id: release
        run: node scripts/release-plan.mjs
        env:
          GITHUB_REF_NAME: ${{ needs.authorize.outputs.ref_name }}
          GITHUB_REF_TYPE: ${{ needs.authorize.outputs.ref_type }}
          RELEASE_SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify release candidate is contained in main
        if: needs.authorize.outputs.ref_type == 'branch'
        run: git merge-base --is-ancestor HEAD origin/main
        working-directory: .
      - name: Verify final release matches the published release candidate
        if: needs.authorize.outputs.ref_type == 'tag'
        run: node scripts/release-provenance.mjs "${{ needs.authorize.outputs.source_sha }}" && git merge-base --is-ancestor HEAD origin/main
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm ci
      - run: npm test
      - name: Set published version
        if: needs.authorize.outputs.ref_type == 'branch'
        run: npm version --no-git-tag-version --allow-same-version "${{ steps.release.outputs.version }}"
      - name: Check for an existing immutable target version
        id: target
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
        run: |
          set +e
          existing_version="$(npm view "@reptilianhq/pons-sdk@${RELEASE_VERSION}" version 2>"${RUNNER_TEMP}/npm-view.err")"
          view_status=$?
          set -e
          if [ "$view_status" -eq 0 ]; then
            test "$existing_version" = "$RELEASE_VERSION"
            existing_git_head="$(npm view "@reptilianhq/pons-sdk@${RELEASE_VERSION}" gitHead)"
            test "$existing_git_head" = "$SOURCE_SHA"
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          elif grep -q E404 "${RUNNER_TEMP}/npm-view.err"; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          else
            cat "${RUNNER_TEMP}/npm-view.err" >&2
            exit "$view_status"
          fi
      - name: Publish to GitHub Packages
        if: steps.target.outputs.exists == 'false'
        run: npm publish --access public --tag "${{ steps.release.outputs.dist_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish or repair the selected install channel
        run: npm dist-tag add "@reptilianhq/pons-sdk@${{ steps.release.outputs.version }}" "${{ steps.release.outputs.dist_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify published install channel
        run: |
          expected="${{ steps.release.outputs.version }}"
          package="@reptilianhq/pons-sdk@${{ steps.release.outputs.dist_tag }}"
          for attempt in 1 2 3 4 5 6; do
            actual="$(npm view "$package" version 2>/dev/null || true)"
            if test "$actual" = "$expected"; then
              echo "$package resolves to $actual"
              exit 0
            fi
            sleep 5
          done
          echo "::error::$package did not resolve to expected version $expected (last observed: ${actual:-missing})"
          exit 1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify package remains public
        run: |
          visibility="$(gh api /orgs/ReptilianHQ/packages/npm/pons-sdk --jq .visibility)"
          test "$visibility" = public || {
            echo "::error::@reptilianhq/pons-sdk visibility is $visibility; the SDK release policy requires a public package."
            exit 1
          }
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
